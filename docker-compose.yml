services:
  web:
    build: .
    image: huynity:latest
    container_name: huynity-interactive
    ports:
      - "6080:6080"
    environment:
      - EXAMPLE=hello_cube
      - RESOLUTION=800x600
      - SDL_VIDEO_DRIVER=x11
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    volumes:
      - ./output:/app/output:z
    command: web

  cube:
    build: .
    image: huynity:latest
    container_name: huynity-cube
    ports:
      - "6080:6080"
