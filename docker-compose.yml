services:
  web:
    build: .
    image: huynity:latest
    container_name: huynity-interactive
    ports:
      - "6080:6080"
    environment:
      - EXAMPLE=hello_cube
      - RESOLUTION=800x600
      - SDL_VIDEO_DRIVER=x11
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    volumes:
      - ./output:/app/output:z
    command: web

  cube:
    build: .
    image: huynity:latest
    container_name: huynity-cube
    ports:
      - "6080:6080"
    environment:
      - EXAMPLE=hello_cube
      - RESOLUTION=800x600
      - SDL_VIDEO_DRIVER=x11
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    volumes:
      - ./output:/app/output:z
    command: web

  village:
    build: .
    image: huynity:latest
    container_name: huynity-village
    ports:
      - "6081:6080"
    environment:
      - EXAMPLE=game_scene
      - RESOLUTION=800x600
      - SDL_VIDEO_DRIVER=x11
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    volumes:
      - ./output:/app/output:z
    command: web

  gallery:
    build: .
    image: huynity:latest
    container_name: huynity-gallery
    ports:
      - "6082:6080"
    environment:
      - EXAMPLE=renderer_gallery
      - RESOLUTION=800x600
      - SDL_VIDEO_DRIVER=x11
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    volumes:
      - ./output:/app/output:z
    command: web

  test:
    build: .
    image: huynity:latest
    container_name: huynity-test
    command: test
